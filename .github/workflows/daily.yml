name: Daily price pipeline

on:
  schedule:
    - cron: "30 12 * * *"   # every day at 12:30 UTC (14:30 Vilnius time)
  workflow_dispatch:         # adds a button to run it manually

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run the pipeline
        run: python pipeline.py

      - name: Save the updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.duckdb
          git commit -m "Daily data update" || echo "No new data"
          git push